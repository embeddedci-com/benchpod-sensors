name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine checksums
        run: cd tools/engine && sha256sum -c SHA256SUMS

      - name: YAML to JSON (the built-in reader and PyYAML agree)
        run: |
          python3 tools/yaml2json.py --outdir build/json-builtin sensors/*/*.yaml stimuli/*.yaml
          pip install --quiet pyyaml
          python3 tools/yaml2json.py --outdir build/json-pyyaml sensors/*/*.yaml stimuli/*.yaml
          diff -r build/json-builtin build/json-pyyaml

      - name: Validate every definition and stimulus
        run: node tools/validate.mjs

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: library.json is up to date
        run: python3 tools/build_library.py --check
