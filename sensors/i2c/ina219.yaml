format: 1
kind: i2c
name: ina219
label: "TI INA219: current, bus voltage and power monitor"
description: |
  A shunt monitor on a high-side shunt: set the current, the bus voltage and the shunt resistor.
  The shunt voltage follows the PGA range the DUT writes to CONFIGURATION (40 to 320 mV, it
  saturates), the bus voltage follows BRNG (16 or 32 V), and CURRENT is computed from the
  CALIBRATION the DUT writes, as the part does (shunt voltage register x calibration / 4096; 0
  until the DUT writes a calibration). BUS_VOLTAGE carries CNVR and OVF. A reset (CONFIGURATION
  bit 15) reloads the power-on image.

  The part's registers are 16 bits wide at consecutive pointers, while the pod serves a byte
  image: a 2-byte read at pointer p returns bytes p and p + 1. CONFIGURATION (0x00), BUS_VOLTAGE
  (0x02) and CURRENT (0x04) read back exactly; writes to every register work. SHUNT_VOLTAGE (0x01),
  POWER (0x03) and a read-back of CALIBRATION (0x05) overlap their neighbors and are not usable:
  compute the power as current x bus voltage in the DUT.
datasheet: https://www.ti.com/product/INA219
version: 1.0.0
license: Apache-2.0

params:
  - { key: current_a, unit: A, min: -10, max: 10, default: 0.5, label: Current }
  - { key: bus_v, unit: V, min: 0, max: 32, default: 12, label: Bus voltage }
  - { key: shunt_ohm, unit: ohm, min: 0.001, max: 10, default: 0.1, label: Shunt resistor }

i2c:
  address: 0x40
  alt_addresses: [0x41, 0x44, 0x45]

let:
  - pg: "bits(reg[0x00], 4, 3)"                         # CONFIGURATION PG (bits 12:11)
  - brng: "bit(reg[0x00], 5)"                           # BRNG (bit 13): 0 = 16 V, 1 = 32 V
  - mode: "bits(reg[0x01], 2, 0)"
  - shunt_fs: "4000 << pg"                              # full scale in 10 uV steps
  - shunt_raw: "clamp(round(current_a * shunt_ohm / 0.00001), -shunt_fs, shunt_fs)"
  - bus_raw: "clamp(round(bus_v / 0.004), 0, brng ? 8000 : 4000)"
  - cal: "((reg[0xF5] << 8) | reg[0x06]) & 0xFFFE"     # CALIBRATION as written (FS0 reads 0)
  - cur_full: "idiv(shunt_raw * cal, 4096)"
  - ovf: "abs(cur_full) > 32767 || abs(cur_full * bus_raw / 5000) > 65535 ? 1 : 0"
  - cnvr: "mode != 0 && mode != 4 ? 1 : 0"                # not in power-down or ADC off

registers:
  - { at: 0x00, u16be: 0x399F, name: CONFIGURATION }    # the DUT's writes stay
  - { at: 0x02, u16be: "(bus_raw << 3) | (cnvr << 1) | ovf", name: BUS_VOLTAGE }
  - { at: 0x04, s16be: "cal ? cur_full : 0", name: CURRENT }
  # 0x05 CALIBRATION: its high byte is image byte 0x05, which CURRENT also uses, so the rule below
  # keeps a copy at 0xF5; its low byte stays at 0x06, where nothing else lives.

on_write:
  - when: "written == 0x00 && (value & 0x80)"           # RST (bit 15)
    do: reset
  - when: "written == 0x05"
    do: { set: { at: 0xF5, u8: "value" } }
